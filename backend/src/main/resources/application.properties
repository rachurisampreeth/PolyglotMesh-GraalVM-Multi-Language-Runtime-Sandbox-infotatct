spring.application.name=PolyglotMesh
server.port=${PORT:7071}
spring.datasource.url=jdbc:h2:file:./data/polyglotmesh;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
mesh.timeout-ms=${EXECUTION_TIMEOUT_MS:30000}
mesh.statement-limit=${STATEMENT_LIMIT:100000}
mesh.output-limit=${OUTPUT_LIMIT:32768}
mesh.code-limit=${CODE_LIMIT:16000}
mesh.max-workers=${MAX_WORKERS:4}
mesh.max-queue=${MAX_QUEUE:16}
mesh.mock-delay-ms=${MOCK_DELAY_MS:40}
mesh.mock-base-url=${MOCK_BASE_URL:http://localhost:7071}
logging.level.org.springframework.web=INFO
