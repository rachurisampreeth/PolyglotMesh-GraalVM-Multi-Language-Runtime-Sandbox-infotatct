spring.application.name=PolyglotMesh
server.port=${PORT:7071}
spring.datasource.url=jdbc:h2:file:./data/polyglotmesh;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.webflux.problemdetails.enabled=true
server.error.include-message=always
mesh.execution.timeout-ms=${EXECUTION_TIMEOUT_MS:60000}
mesh.execution.max-code-chars=16000
mesh.execution.max-output-bytes=32768
# Never expose a code-execution demo to your network by default.
server.address=${SERVER_ADDRESS:127.0.0.1}
